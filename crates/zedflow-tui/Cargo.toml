[package]
name = "zedflow-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
markdown = "=1.0.0"
# ICU data is pinned to match the Pi segmentation/Unicode policy.
icu_properties = "=2.2.0"
icu_segmenter = "=2.2.0"
emojis = "=0.9.0"
crossterm = "=0.29.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGEventSource", "CGEventTypes"] }
