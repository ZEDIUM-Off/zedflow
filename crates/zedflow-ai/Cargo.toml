[package]
name = "zedflow-ai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
zedflow-core = { path = "../zedflow-core" }
base64 = "0.22"
futures = "0.3"
getrandom = "0.4"
genai = { version = "0.7.0-beta.10", default-features = false, features = ["rustls-tls"] }
jsonschema = { version = "0.42.0", default-features = false }
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[[bin]]
name = "generate-models"
path = "scripts/generate-models.rs"

[[bin]]
name = "generate-image-models"
path = "scripts/generate-image-models.rs"
