[package]
name = "zedflow-ai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
aws-config = "1.9"
aws-sdk-bedrockruntime = "1.136"
aws-smithy-http-client = { version = "1.2", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = "1.13"
aws-smithy-types = "1.6"
base64 = "0.22"
futures = "0.3"
futures-timer = "3"
gcp_auth = "0.12.7"
getrandom = "0.4"
httpdate = "1"
jsonschema = { version = "0.42.0", default-features = false }
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
zstd = "0.13"

[[bin]]
name = "generate-models"
path = "scripts/generate-models.rs"

[[bin]]
name = "generate-image-models"
path = "scripts/generate-image-models.rs"
