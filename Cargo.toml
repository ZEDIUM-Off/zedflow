[package]
name = "zedflow-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false
description = "ADK-Rust experiments for a modular graph-native harness"

[workspace]
resolver = "3"

[features]
default = []
web = ["dep:axum", "dep:serde", "dep:uuid"]
# The whole published library catalog, without enabling every provider/backend flag.
all-adk = ["adk-platform", "local-inference"]
adk-platform = [
    "dep:get-size2", "dep:libdbus-sys",
    "dep:adk-acp",
    "dep:adk-action",
    "dep:adk-anthropic",
    "dep:adk-artifact",
    "dep:adk-audio",
    "dep:adk-auth",
    "dep:adk-awp",
    "dep:adk-bench",
    "dep:adk-browser",
    "dep:adk-cli",
    "dep:adk-code",
    "dep:adk-codeact-monty",
    "dep:adk-computer-use",
    "dep:adk-deploy",
    "dep:adk-devtools",
    "dep:adk-enterprise",
    "dep:adk-eval",
    "dep:adk-gcp",
    "dep:adk-gemini",
    "dep:adk-guardrail",
    "dep:adk-managed",
    "dep:adk-payments",
    "dep:adk-plugin",
    "dep:adk-rag",
    "dep:adk-realtime",
    "dep:adk-retry-reflect",
    "dep:adk-rust",
    "dep:adk-rust-macros",
    "dep:adk-sandbox",
    "dep:adk-server",
    "dep:adk-skill",
    "dep:adk-telemetry",
    "dep:awp-types",
    "adk-rust/full", "adk-rust/graph-sqlite", "adk-rust/cli",
]
local-inference = ["dep:adk-mistralrs"]

[dependencies]
axum = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
# Monty/Ruff require the compact_str 0.9 GetSize implementation (upstream lock).
get-size2 = { version = "=0.10.1", optional = true }
# adk-cli keyring support on Linux, without requiring system D-Bus headers.
libdbus-sys = { version = "0.2", features = ["vendored"], optional = true }
adk-acp = { version = "=2.2.0", default-features = false, optional = true }
adk-action = { version = "=2.2.0", default-features = false, optional = true }
adk-agent = { version = "=2.2.0", default-features = false }
adk-anthropic = { version = "=2.2.0", default-features = false, optional = true }
adk-artifact = { version = "=2.2.0", default-features = false, optional = true }
adk-audio = { version = "=2.2.0", default-features = false, optional = true }
adk-auth = { version = "=2.2.0", default-features = false, optional = true }
adk-awp = { version = "=2.2.0", default-features = false, optional = true }
adk-bench = { version = "=2.2.0", default-features = false, optional = true }
adk-browser = { version = "=2.2.0", default-features = false, optional = true }
adk-cli = { version = "=2.2.0", default-features = false, optional = true }
adk-code = { version = "=2.2.0", default-features = false, optional = true }
adk-codeact-monty = { version = "=2.2.0", default-features = false, optional = true }
adk-computer-use = { version = "=2.2.0", default-features = false, optional = true }
adk-core = { version = "=2.2.0", default-features = false }
adk-deploy = { version = "=2.2.0", default-features = false, optional = true }
adk-devtools = { version = "=2.2.0", default-features = false, optional = true }
adk-enterprise = { version = "=2.2.0", default-features = false, optional = true }
adk-eval = { version = "=2.2.0", default-features = false, optional = true }
adk-gcp = { version = "=2.2.0", default-features = false, optional = true }
adk-gemini = { version = "=2.2.0", default-features = false, optional = true }
adk-graph = { version = "=2.2.0", default-features = false, features = ["sqlite", "functional", "node-cache", "delta-checkpoint", "time-travel"] }
adk-guardrail = { version = "=2.2.0", default-features = false, optional = true }
adk-managed = { version = "=2.2.0", default-features = false, optional = true }
adk-memory = { version = "=2.2.0", default-features = false }
adk-mistralrs = { version = "=2.2.0", default-features = false, optional = true }
adk-model = { version = "=2.2.0", default-features = false, features = ["gemini"] }
adk-payments = { version = "=2.2.0", default-features = false, optional = true }
adk-plugin = { version = "=2.2.0", default-features = false, optional = true }
adk-rag = { version = "=2.2.0", default-features = false, optional = true }
adk-realtime = { version = "=2.2.0", default-features = false, optional = true }
adk-retry-reflect = { version = "=2.2.0", default-features = false, optional = true }
adk-runner = { version = "=2.2.0", default-features = false }
adk-rust = { version = "=2.2.0", default-features = false, optional = true }
adk-rust-macros = { version = "=2.2.0", default-features = false, optional = true }
adk-sandbox = { version = "=2.2.0", default-features = false, optional = true }
adk-server = { version = "=2.2.0", default-features = false, optional = true }
adk-session = { version = "=2.2.0", default-features = false }
adk-skill = { version = "=2.2.0", default-features = false, optional = true }
adk-telemetry = { version = "=2.2.0", default-features = false, optional = true }
adk-tool = { version = "=2.2.0", default-features = false }
awp-types = { version = "=2.2.0", default-features = false, optional = true }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }

[profile.dev]
debug = 0

[profile.test]
debug = 0
