[workspace]
members = [
    "crates/zedflow-core",
    "crates/zedflow-ai",
    "crates/zedflow-agent",
    "crates/zedflow-coding-agent",
    "crates/zedflow-orchestrator",
    "crates/zedflow-tui",
    "crates/zedflow-tools",
    "crates/zedflow-session",
    "crates/zedflow-langgraph",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
repository = "https://github.com/ZEDIUM-Off/zedflow"
homepage = "https://github.com/ZEDIUM-Off/zedflow"
authors = ["ZEDIUM <matisse.chenavas@gmail.com>"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.perf]
inherits = "release"
opt-level = 3
lto = "thin"
debug = 1
strip = false
