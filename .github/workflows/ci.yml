name: ADK lab

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --workspace --all-targets --features web
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --features web -- -D warnings
